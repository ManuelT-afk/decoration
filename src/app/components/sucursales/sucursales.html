<section>
  <div class="container">
    <div class="row">
      <div class="col s12 center-align">
        <h1>Nuestras Sucursales</h1>
      </div>
    </div>

    <div class="row">
      <div class="col s4" *ngFor="let mapa of mapas">
        <div class="card">
          <div class="card-image">
            <iframe
              [src]="mapa.urlMapa"
              class="mapa-iframe"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
            <span class="card-title">{{ mapa.nombre }}</span>
          </div>
          <div class="card-content">
            <p>{{ mapa.direccion }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
