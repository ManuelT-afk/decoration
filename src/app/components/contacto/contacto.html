<form #contactoForm="ngForm" (ngSubmit)="guardar()" novalidate>
  <section class="reveal-left" appScrollReveal>
    <div class="container">
      <div class="row">
        <div class="col s12 center-align">
          <h1>Contáctanos...</h1>
        </div>
      </div>

      <div class="row">
        <div class="col s12 input-field">
          <input
            type="text"
            name="nombre"
            id="nombre"
            pattern="[A-Za-z\sÁÉÍÓÚáéíóúÑñ]{10,80}"
            minlength="10"
            maxlength="80"
            data-length="80"
            [(ngModel)]="formulario.nombre"
            #nombreControl="ngModel"
            required
          />
          <label for="nombre">Nombre</label>
          <span class="helper-text" data-error="Dato invalido" data-success="Datos correctos"></span>
        </div>
      </div>

      <div class="row">
        <div class="col s12 input-field">
          <input
            type="email"
            name="correo"
            id="email"
            maxlength="70"
            data-length="70"
            class="validate"
            [(ngModel)]="formulario.correo"
            #correoControl="ngModel"
            required
          />
          <label for="email">Email</label>
          <span class="helper-text" data-error="Dato invalido" data-success="Datos correctos"></span>
        </div>
      </div>

      <div class="row">
        <div class="col s12 input-field">
          <input
            type="text"
            name="telefono"
            id="telefono"
            pattern="[0-9]{10}"
            data-length="10"
            class="validate"
            [(ngModel)]="formulario.telefono"
            #telefonoControl="ngModel"
            required
          />
          <label for="telefono">Teléfono</label>
          <span class="helper-text" data-error="Dato invalido" data-success="Datos correctos"></span>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <input type="date" name="fecha" id="fecha" [(ngModel)]="formulario.fecha" required />
          <label for="fecha">Fecha</label>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <label>Modalidad de Entrega</label>
          <ul>
            <li>
              <label>
                <input type="radio" name="modalidad" required value="recoger" [(ngModel)]="formulario.modalidad" />
                <span>Recoger sucursal</span>
              </label>
            </li>
            <li>
              <label>
                <input type="radio" name="modalidad" required value="domicilio" [(ngModel)]="formulario.modalidad" />
                <span>Entrega a domicilio</span>
              </label>
            </li>
            <li>
              <label>
                <input type="radio" name="modalidad" required value="envio" [(ngModel)]="formulario.modalidad" />
                <span>Plataforma de Envío</span>
              </label>
            </li>
          </ul>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <div class="input-field">
            <select
              name="tipoProducto"
              id="tipoProducto"
              class="validate"
              [(ngModel)]="formulario.tipoProducto"
              required
            >
              <option value="" disabled selected>[Seleccion]</option>
              <option value="pastel">Pastel</option>
              <option value="panaderia">Panaderia</option>
              <option value="galletas">Galletas</option>
              <option value="Boleria">Boleria</option>
            </select>
            <label>Selecciona el tipo de Producto</label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <label>Selecciona tus complementos</label>
          <ul>
            <li>
              <label>
                <input
                  type="checkbox"
                  name="complementoVelas"
                  value="velas"
                  [checked]="tieneComplemento('velas')"
                  (change)="seleccionarComplemento('velas', $any($event.target).checked)"
                />
                <span>Velas de pastel</span>
              </label>
            </li>
            <li>
              <label>
                <input
                  type="checkbox"
                  name="complementoFigura"
                  value="figuraDecorativa"
                  [checked]="tieneComplemento('figuraDecorativa')"
                  (change)="seleccionarComplemento('figuraDecorativa', $any($event.target).checked)"
                />
                <span>Figura Decorativa</span>
              </label>
            </li>
            <li>
              <label>
                <input
                  type="checkbox"
                  name="complementoBolsa"
                  value="bolsaEcologica"
                  [checked]="tieneComplemento('bolsaEcologica')"
                  (change)="seleccionarComplemento('bolsaEcologica', $any($event.target).checked)"
                />
                <span>Bolsa Ecologica</span>
              </label>
            </li>
          </ul>
        </div>
      </div>

      <div class="row">
        <div class="col s12 input-field">
          <textarea
            name="comentarios"
            id="comentarios"
            class="materialize-textarea validate"
            maxlength="200"
            data-length="200"
            [(ngModel)]="formulario.detalles"
            required
          ></textarea>
          <label for="comentarios">Detalles del pedido</label>
          <span class="helper-text" data-error="Dato invalido" data-success="Datos correctos"></span>
        </div>
      </div>

      <div class="row">
        <div class="col s12">
          <p>Aceptas el aviso de privacidad</p>
          <div class="switch">
            <label>
              No
              <input type="checkbox" name="aviso" id="aceptar" [(ngModel)]="formulario.aviso" />
              <span class="lever"></span>
              Si
            </label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col s12 center-align">
          <button type="submit" class="btn brown lighten-2" [disabled]="guardando || !formularioValido">
            {{ idEditar ? 'Actualizar' : 'Guardar' }}
          </button>

          <button type="button" class="btn orange lighten-4" (click)="limpiar()">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </section>
</form>

<div class="card">
  <div class="card-content">
    <h5>Solicitudes registradas</h5>
    <div class="tabla-contenedor">
      <table class="striped responsive-table">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Correo</th>
            <th>Producto</th>
            <th>Fecha</th>
            <th>Entrega</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of solicitudes">
            <td>{{ s.nombre }}</td>
            <td>{{ s.correo }}</td>
            <td>{{ s.tipoProducto }}</td>
            <td>{{ s.fecha }}</td>
            <td>{{ s.modalidad }}</td>
            <td>
              <button type="button" class="btn-small blue" (click)="editar(s)">Editar</button>
              <button type="button" class="btn-small red" (click)="eliminar(s)">Eliminar</button>
            </td>
          </tr>
          <tr *ngIf="solicitudes.length === 0">
            <td colspan="6">Sin solicitudes.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
